[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "templock"
version = "0.1.0"
description = "TempLock - GGUF chat-template integrity for the LLM supply chain (pin to upstream, fail closed)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ujwal Ramachandran"},
]
keywords = ["gguf", "llm", "security", "supply-chain", "chat-template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "gguf>=0.6.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
templock = "ghost_in_the_template.cli:main"
ghost-in-the-template = "ghost_in_the_template.cli:main"

[tool.setuptools.packages.find]
include = ["ghost_in_the_template*"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
